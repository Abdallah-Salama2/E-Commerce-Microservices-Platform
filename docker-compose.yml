# ============================================================================
# Root docker-compose.yml — orchestrates ALL services + shared infrastructure.
# Per the project's own architecture rule: this file describes relationships
# BETWEEN services, so unlike almost everything else in the repo it is never
# per-service. Lives at the repo root, next to /services.
#
# Layout assumed:
#   ecommerce-microservices/
#   ├── docker-compose.yml          <- this file
#   ├── docker-compose.override.yml
#   └── services/
#       ├── identity-service/
#       ├── catalog-service/
#       ├── inventory-service/
#       ├── cart-service/
#       ├── order-service/
#       └── media-service/
#
# One SQL Server *container* hosts multiple *databases* — one per service,
# created automatically by each service's own migrate.js on first boot.
# This does not violate "one database per service, no cross-service FKs" —
# that rule is about logical/schema isolation, not needing six separate
# SQL Server processes. Same reasoning for sharing one Redis container:
# every service already namespaces its own keys (catalog:, cart:, media:).
# ============================================================================

x-shared-env: &shared-env
  NODE_ENV: development
  DB_USER: sa
  DB_PASSWORD: "YourStrong@Passw0rd"
  DB_SERVER: db
  # NOTE: this is the CONTAINER-INTERNAL port (1433), not the host-mapped
  # port below (1434). Service-to-service traffic inside the compose network
  # never goes through the host port mapping — only things on your machine
  # connecting from outside Docker (e.g. Azure Data Studio) use 1434.
  DB_PORT: "1433"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka:9092"
  # MUST be byte-identical across every service that verifies a JWT
  # (identity, catalog, inventory, cart, order, media). A mismatch does NOT
  # error anywhere — cart-service in particular just silently falls back to
  # guest mode. Replace this with a real random secret before this touches
  # anything beyond your own machine.
  JWT_ACCESS_SECRET: "replace-with-a-long-random-secret-shared-by-every-service"
  # MUST match between cart-service and order-service (the only two that
  # currently use it) for internal service-to-service calls.
  INTERNAL_SERVICE_SECRET: "replace-with-a-different-long-random-secret"
  OUTBOX_POLL_INTERVAL_MS: "2000"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 15s

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1434:1433" # host access only (e.g. a GUI client) — services use 1433 internally, see DB_PORT above
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-C", "-Q", "SELECT 1"]
      <<: *healthcheck-defaults
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka  # <-- ADD THIS
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft mode — no Zookeeper needed for this project's scale.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      <<: *healthcheck-defaults
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads-data:/var/www/uploads:ro
    depends_on:
      - identity-service
      - catalog-service
      - inventory-service
      - cart-service
      - order-service
      - media-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ==========================================================================
  # Application services
  # ==========================================================================
  identity-service:
    build:
      context: ./services/identity-service
      target: production
    ports:
      - "5000:5000"
    environment:
      <<: *shared-env
      PORT: "5000"
      DB_NAME: identity_service
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: "replace-with-a-long-random-refresh-secret"
      REFRESH_COOKIE_NAME: refreshToken
      BCRYPT_SALT_ROUNDS: "10"
      CART_SERVICE_URL: "http://cart-service:5003"
      # Placeholder SMTP creds — swap for a real provider (or Mailhog/
      # Mailtrap for local dev) before password reset emails need to work.
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USER: "placeholder"
      SMTP_PASSWORD: "placeholder"
      SMTP_FROM: "no-reply@example.com"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build:
      context: ./services/catalog-service
      target: production
    ports:
      - "5001:5001"
    environment:
      <<: *shared-env
      PORT: "5001"
      DB_NAME: catalog_service
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build:
      context: ./services/inventory-service
      target: production
    ports:
      - "5002:5002"
    environment:
      <<: *shared-env
      PORT: "5002"
      DB_NAME: inventory_service
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    build:
      context: ./services/cart-service
      target: production
    ports:
      - "5003:5003"
    environment:
      <<: *shared-env
      PORT: "5003"
      CATALOG_SERVICE_URL: "http://catalog-service:5001"
      INVENTORY_SERVICE_URL: "http://inventory-service:5002"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      target: production
    ports:
      - "5004:5004"
    environment:
      <<: *shared-env
      PORT: "5004"
      DB_NAME: order_service
      CART_SERVICE_URL: "http://cart-service:5003"
      CATALOG_SERVICE_URL: "http://catalog-service:5001"
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  media-service:
    build:
      context: ./services/media-service
      target: production
    ports:
      - "5005:5005"
    environment:
      <<: *shared-env
      PORT: "5005"
      DB_NAME: media_service
      CATALOG_SERVICE_URL: "http://catalog-service:5001"
    volumes:
      # Only media-service writes to disk (raw uploads + processed images) —
      # the reference file's version of this mounted it on a single generic
      # "app" service, which doesn't apply once there are six services.
      - uploads-data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      target: production
    ports:
      - "5006:5006"
    environment:
      <<: *shared-env
      PORT: "5006"
      DB_NAME: notification_service
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
      # Same placeholder pattern as identity-service — swap for a real
      # provider (or Mailhog/Mailtrap for local dev) before order-confirmed/
      # order-cancelled emails need to actually deliver anywhere.
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USER: "placeholder"
      SMTP_PASSWORD: "placeholder"
      SMTP_FROM: "no-reply@example.com"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Not a hard runtime dependency (Kafka will just redeliver once
      # identity-service is reachable), but there's no point racing it on
      # first boot since every notification needs identity-service anyway.
      identity-service:
        condition: service_started
    restart: unless-stopped

volumes:
  sql-data:
  redis-data:
  uploads-data:
