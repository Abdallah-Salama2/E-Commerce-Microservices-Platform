worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    application/json;

    upstream identity_service    { server identity-service:5000; }
    upstream catalog_service     { server catalog-service:5001; }
    upstream inventory_service   { server inventory-service:5002; }
    upstream cart_service        { server cart-service:5003; }
    upstream order_service       { server order-service:5004; }
    upstream media_service       { server media-service:5005; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        # CORS headers, unconditional (note "always") — attached to EVERY
        # response, including the 204 below. This is what lets the `if`
        # block stay minimal: it no longer needs its own add_header calls,
        # sidestepping the "add_header not allowed in if-outside-location"
        # restriction entirely.
        add_header Access-Control-Allow-Origin "http://localhost:8080" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-internal-secret" always;

        # Only the actually-conditional behavior lives in the if now.
        if ($request_method = OPTIONS) {
            return 204;
        }

        client_max_body_size 1m;

        location /api/internal/ {
            return 403;
        }
        location = /api/cart/merge {
            return 403;
        }

        location = /api/products/images/batch {
            proxy_pass http://media_service;
        }

        location ~ ^/api/products/[0-9]+/images {
            client_max_body_size 6m;
            proxy_pass http://media_service;
        }

        location /uploads/ {
            alias /var/www/uploads/;
        }

        location /api/auth      { proxy_pass http://identity_service; }
        location /api/addresses { proxy_pass http://identity_service; }

        location /api/categories { proxy_pass http://catalog_service; }
        location /api/products   { proxy_pass http://catalog_service; }

        location /api/stock { proxy_pass http://inventory_service; }

        location /api/cart { proxy_pass http://cart_service; }

        location /api/orders { proxy_pass http://order_service; }

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }
    }
}